name: Python Build

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      commit:
        required: false
        type: string
      ref:
        required: false
        type: string
      python-version:
        required: true
        type: string
      os:
        required: true
        type: string

jobs:
  Python:
    name: ${{ inputs.os }}, python ${{ inputs.python-version }}
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    env:
      PYTHON: ${{ inputs.python-version }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      if: ${{ !inputs.branch && !inputs.commit }}

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      if: ${{ inputs.branch }}
      with:
        ref: ${{ inputs.branch }}
        fetch-depth: 0

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      if: ${{ inputs.commit }}
      with:
        ref: ${{ inputs.commit }}

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      if: ${{ inputs.ref }}
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Hatch
      run: |
        pip install --upgrade hatch "click<8.3" "virtualenv<21"

    - name: Run Linting
      run: hatch -v run lint

    - name: Run Build
      run: hatch -v build

    - name: Run Tests
      run: hatch run test